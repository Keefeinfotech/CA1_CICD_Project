# ============================================================
# File Name: analysis_options.yaml
# Description: Configures Dart static analysis and lint rules
#              for the Auxilia Flutter application.
# Author: Keefe Chen
# ============================================================

# Activate the recommended Flutter lint rules.
include: package:flutter_lints/flutter.yaml

# ============================================================
# Analyzer Configuration
# ============================================================

analyzer:
  # Exclude generated build files and platform-specific folders
  # from Dart static analysis.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

# ============================================================
# Linter Configuration
# ============================================================

linter:
  rules:
    # Enforce consistent string quotation.
    prefer_single_quotes: true

    # Avoid using print() for application logging.
    avoid_print: true

    # Prefer using const constructors where possible.
    prefer_const_constructors: true

    # Prefer using const declarations where possible.
    prefer_const_declarations: true

    # Avoid unnecessary empty containers.
    avoid_empty_else: true

    # Prefer final for variables that are not reassigned.
    prefer_final_locals: true

    # Avoid unnecessary type declarations.
    omit_local_variable_types: false
