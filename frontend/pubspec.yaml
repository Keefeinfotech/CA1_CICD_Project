name: frontend
description: "Auxilia - offline-first task manager with accounts and an AI assistant."

# Prevent accidental publication to pub.dev.
publish_to: 'none'

# Application version and build number.
version: 1.0.0+1

# Dart SDK compatibility.
environment:
  sdk: '>=3.9.0 <4.0.0'

# Application dependencies.
dependencies:
  flutter:
    sdk: flutter

  # UI and platform utilities.
  cupertino_icons: ^1.0.8

  # Networking.
  http: ^1.6.0
  dio: ^5.11.1

  # Local preferences and secure storage.
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  # Web support.
  web: ^1.1.2

  # State management and navigation.
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2

  # Data models and serialization.
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Local database and file management.
  drift: ^2.35.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1

  # Local notifications.
  flutter_local_notifications: ^22.3.3

# Development dependencies.
dev_dependencies:
  # Flutter unit and widget testing.
  flutter_test:
    sdk: flutter

  # Flutter integration testing.
  integration_test:
    sdk: flutter

  # Static analysis and linting.
  flutter_lints: ^6.0.0

  # Code generation.
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.2

  # Mocking dependencies for tests.
  mocktail: ^1.0.5

# Flutter-specific configuration.
flutter:
  uses-material-design: true

  # Add application assets here when required.
  # assets:
  #   - assets/images/